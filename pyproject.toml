# The uv workspace: one lockfile and one `.venv` for every Python package in
# the repo. `uv sync` here installs all of them, the generators built through
# maturin and `misina-lab` as plain Python.
[tool.uv.workspace]
members = ["crates/vinerylab", "crates/greenhouse-lab", "python/misina-lab"]

[dependency-groups]
dev = ["pytest", "ruff~=0.14.0", "mypy~=1.18"]

[tool.ruff]
# rustfmt's width, so one number covers both halves of the repo.
line-length = 100

[tool.ruff.lint]
# On top of the defaults (E4, E7, E9, F): import sorting and pyupgrade.
extend-select = ["I", "UP"]

[tool.ruff.lint.isort]
# Every package is installed into the environment, so ruff would otherwise
# file their own imports under third-party.
known-first-party = ["greenhouse_lab", "misina_lab", "vinerylab"]

[tool.ruff.lint.per-file-ignores]
# The demo mirrors Isaac Lab's own example layout, which groups imports by
# subsystem rather than by isort's rules.
"examples/*_demo/*" = ["I001"]

[tool.mypy]
files = [
    "python/misina-lab/misina_lab",
    "crates/vinerylab/python/vinerylab",
    "crates/greenhouse-lab/python/greenhouse_lab",
]
# Isaac Lab cannot be imported without the whole simulator stack installed.
exclude = "/isaaclab/"

[[tool.mypy.overrides]]
module = "pxr.*"
ignore_missing_imports = true
