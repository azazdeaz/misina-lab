[project]
name = "greenhouse-demo"
version = "0.1.0"
description = "A generated greenhouse in Isaac Sim: rendered for the docs, its trusses bent and cut, and harvested by a robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "greenhouse-lab",
    "huggingface-hub>=1.16",
    "isaaclab[isaacsim,all]==3.0.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
index-strategy = "unsafe-best-match"
# Isaac Lab's own resolver pins, which its wheel does not carry. Without them the
# `isaacsim` extra downgrades the stack it is resolved against. Mirrors
# tools/wheel_builder/uv-overrides.txt at the tag of the pinned release.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
greenhouse-lab = { path = "../../crates/greenhouse-lab", editable = true }
# What greenhouse-lab is built on; a workspace source inside the path above does
# not reach a project outside that workspace, so it is named here too.
misina-lab = { path = "../../python/misina-lab", editable = true }
