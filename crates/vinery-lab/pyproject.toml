[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "vinery-lab"
description = "Procedural vineyard scene generation, authored to USD."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Andras Polgar", email = "azazdeaz@gmail.com" }]
dynamic = ["version"]
# The generator builds the scene in Bevy and hands it over as JSON; the USD
# stage is authored by `misina_lab.usd`, which brings `usd-core` with it.
# Pinned exactly, to the workspace version both packages release under: the
# scene document this extension writes is the one that release reads.
dependencies = ["misina-lab==0.1.0"]

[project.urls]
Repository = "https://github.com/azazdeaz/misina-lab"

[tool.uv.sources]
misina-lab = { workspace = true }

[tool.maturin]
features = ["extension-module"]
module-name = "vinery_lab._core"
python-source = "python"
