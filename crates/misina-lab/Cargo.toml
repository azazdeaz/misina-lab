[package]
name = "misina-lab"
description = "What a procedural scene generator is built from."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bevy = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }
curvo = { workspace = true }
nalgebra = { workspace = true }
spade = { workspace = true }
usvg = { workspace = true }
bevy_panorbit_camera = "0.36.0"

[features]
# The Python side of the `generator!` macro and the glue under it
# (src/python.rs). A generator's own `python` feature enables this one.
python = ["dep:pyo3"]

# Web build only. Cargo unions features across target-specific and plain
# dependency entries, so `webgpu` below lands on wasm and nowhere else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 has no compute shaders, so it gets none of the GPU preprocessing a
# generated scene's mesh count wants; `webgpu` takes precedence over the
# default `webgl2` on wasm. The backend is chosen at compile time, so one build
# serves one set of browsers — Chrome, Edge, a recent Firefox, Safari 26+.
bevy = { workspace = true, features = ["webgpu"] }
# `getrandom` reaches wasm32-unknown-unknown twice — 0.4 under bevy_math's rand,
# 0.3 under curvo's argmin — and neither picks a backend on its own. Renamed
# because two majors of one crate cannot share a key.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
