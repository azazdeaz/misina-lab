name: Playground

# Manual only: a fat-LTO wasm build of Bevy takes ~15 minutes, and a demo page
# does not have to track every push. It publishes the bundle to the
# `playground` release rather than deploying it: pages.yml deploys the whole
# site, the bundle included, and runs once this succeeds.
on: workflow_dispatch

# To create the release and replace its asset.
permissions:
  contents: write

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Its own cache: ci.yml builds a different target with a different
      # profile, so sharing one would have them evict each other.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Has to be the version Cargo.lock resolved. A mismatch between the CLI
      # and the shims compiled into the module fails at page load, not here.
      - name: Read the locked wasm-bindgen version
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
                | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "wasm-bindgen $v"
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}

      # No apt packages: alsa, udev and wayland are all native-only paths.
      - run: cargo build --profile wasm-release --target wasm32-unknown-unknown --bin vinery-lab

      - name: Bundle the playground
        run: |
          mkdir -p bundle
          cp web/index.html bundle/
          wasm-bindgen --target web --no-typescript --out-dir bundle \
            target/wasm32-unknown-unknown/wasm-release/vinery-lab.wasm
          ls -lh bundle
          tar -czf vinery.tar.gz -C bundle .

      # One asset per playground, named for where pages.yml serves it:
      # vinery.tar.gz is /playground/vinery/.
      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view playground > /dev/null 2>&1 ||
            gh release create playground --prerelease --target "$GITHUB_SHA" \
              --title Playground --notes "The playgrounds' latest builds, which the Pages workflow deploys."
          gh release upload playground vinery.tar.gz --clobber
