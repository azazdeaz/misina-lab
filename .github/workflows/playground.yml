name: Playground

# Manual only: a fat-LTO wasm build of Bevy takes ~20 minutes, and a demo page
# does not have to track every push. It publishes the bundle to the
# `playground` release rather than deploying it: pages.yml deploys the whole
# site, the bundle included, and runs once this succeeds.
on: workflow_dispatch

# To create the release and replace its asset.
permissions:
  contents: write

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Its own cache: ci.yml builds a different target with a different
      # profile, so sharing one would have them evict each other.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Has to be the version Cargo.lock resolved. A mismatch between the CLI
      # and the shims compiled into the module fails at page load, not here.
      - name: Read the locked wasm-bindgen version
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
                | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "wasm-bindgen $v"
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}

      # No apt packages: alsa, udev and wayland are all native-only paths. One
      # viewer at a time: two fat-LTO links at once run the runner out of
      # memory. The dependencies compile once, in the first.
      - run: |
          for p in vinery-lab greenhouse-lab; do
            cargo build --profile wasm-release --target wasm32-unknown-unknown -p "$p" --bins
          done

      # One bundle per playground, named for where pages.yml serves it:
      # vinery.tar.gz is /playground/vinery/.
      - name: Bundle the playgrounds
        run: |
          bundle() { # name, binary, title
            mkdir -p "bundle/$1"
            sed "s/{title}/$3/" web/index.html > "bundle/$1/index.html"
            wasm-bindgen --target web --no-typescript --out-name viewer --out-dir "bundle/$1" \
              "target/wasm32-unknown-unknown/wasm-release/$2.wasm"
            tar -czf "$1.tar.gz" -C "bundle/$1" .
          }
          bundle vinery vinery-lab "Vinery Lab"
          bundle greenhouse greenhouse-lab "Greenhouse Lab"
          ls -lh bundle/* *.tar.gz

      - name: Publish the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view playground > /dev/null 2>&1 ||
            gh release create playground --prerelease --target "$GITHUB_SHA" \
              --title Playground --notes "The playgrounds' latest builds, which the Pages workflow deploys."
          gh release upload playground *.tar.gz --clobber
